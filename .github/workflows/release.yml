name: Build and publish the skill bundle

# A .skill file is a zip of the skill directory. Building it on a tag rather than by hand
# means the published bundle is always the tagged tree: nobody has to remember to rebuild,
# and there is no version of the bundle that does not correspond to a commit.
#
# The order below is the point of this file. A bundle that installs and then does nothing --
# because the description is too long, or an asset never got copied -- is a check whose
# failure mode is to report success, which is the defect this repository exists to document.
# So the pipeline refuses to publish rather than publish something it has not looked at, and
# it proves its own validator before trusting it.
#
# MANIFEST is the single source of truth for what ships. Staging reads it and verification
# reads it, because two lists drift and the drift is invisible: each one stays internally
# consistent while they disagree with each other.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the validator needs
        run: pip install --quiet pyyaml

      # Before trusting the validator, break it on purpose and check that it screams. It
      # mutates a temporary copy once per rule and fails unless every one is rejected AND
      # the untouched skill is still accepted. A verifier that has never been seen to fail
      # is not evidence, including this one.
      - name: Prove the validator fails when it should
        run: python scripts/validate_skill.py . --manifest MANIFEST --self-test

      - name: Validate the source tree
        run: python scripts/validate_skill.py . --manifest MANIFEST

      # Nothing shippable may be missing from MANIFEST. The list is checked in one
      # direction by staging (manifest -> tree); this is the other (tree -> manifest).
      # Without it a new reference file cited by SKILL.md ships as a dangling reference
      # under a fully green pipeline, because MANIFEST is a second list maintained by
      # hand -- the shape this project already calls out as failing silently.
      - name: Nothing shippable is missing from MANIFEST
        run: |
          set -euo pipefail
          missing=0
          for f in reference/*.md assets/*.md SKILL.md LICENSE; do
            grep -qxF "$f" MANIFEST || { echo "FATAL: $f is in the tree and not in MANIFEST"; missing=1; }
          done
          test "$missing" = 0 || { echo "Add it, or add an explicit '# not shipped:' line."; exit 1; }
          echo "checked $(ls reference/*.md assets/*.md | wc -l) shippable documents"

      # A fenced command block in the documentation is a claim. This runs them against a
      # fixture channel with known ground truth. Two adversarial reviews found that the
      # costliest defects were all in commands nobody had executed.
      - name: The documented commands do what they claim
        run: |
          python scripts/check_doc_commands.py --self-test
          python scripts/check_doc_commands.py

      # The pipeline checked the ARTEFACT thoroughly and never once checked a claim the
      # repository makes about itself. Of the three objectives it declares, zero were
      # covered; of the four closed decisions, one. The three costliest defects of the
      # fifth review were all of that kind -- a number written twice that stopped
      # agreeing, a value shape enforced in three documents of four, an example modelling
      # the opposite of the paragraph above it -- and each was a four-line grep of the
      # same shape as the MANIFEST step twenty lines up.
      - name: Prove the claim checks fail when they should
        run: python scripts/check_own_claims.py --self-test

      - name: The repository does what it says it does
        run: python scripts/check_own_claims.py

      # The bundle now carries its own version, so an installed copy can say which one it
      # is. That is only worth anything if it matches the tag it ships under.
      - name: The version in SKILL.md is the tag being published
        run: |
          set -euo pipefail
          declared=$(python -c "import re,sys;print(re.search(r'^  version:\s*(\S+)',open('SKILL.md').read(),re.M).group(1))")
          echo "declared: $declared   ·   tag: ${GITHUB_REF_NAME}"
          test "v$declared" = "${GITHUB_REF_NAME}" || {
            echo "FATAL: SKILL.md says $declared and the tag says ${GITHUB_REF_NAME}."
            echo "An installed skill that misreports its own version is worse than one that says nothing."
            exit 1; }

      # v0.1.1 shipped a bundle whose CONTENT every check approved and which did not
      # install: `zip -r` emits directory entries and mixes compression, and no check here
      # looked at what the archive WAS rather than what it held. Same reason `zip -r` also
      # merged a stale file from an earlier build into a freshly staged one. Both are gone
      # because the archive is now written from Python, which has no pre-existing object to
      # merge into and emits no directory entries.
      - name: Prove the packager rejects a wrongly shaped bundle
        run: python scripts/package_skill.py --self-test

      # Builds it, then checks it twice: SHAPE (files only, deflated, exactly the manifest,
      # one root) and CONTENT (extracted and put through the validator with --exact). The
      # artifact is a different object from the tree it came from, and until v0.1.1 only
      # the tree had ever been judged.
      - name: Build the bundle and check what it is, not only what it holds
        run: python scripts/package_skill.py

      - name: Report what is being published
        run: |
          set -euo pipefail
          echo "tag:   ${GITHUB_REF_NAME}"
          echo "size:  $(du -h ./*.skill | cut -f1)"
          python - <<'PY'
          import zipfile
          import glob
          z = zipfile.ZipFile(glob.glob("*.skill")[0])
          print("files:", len(z.infolist()))
          for n in sorted(z.namelist()):
              print("  ", n)
          PY

      - name: Publish it on the release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.skill'
          generate_release_notes: true
